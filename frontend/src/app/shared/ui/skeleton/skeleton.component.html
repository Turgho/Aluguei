@if (type === 'dashboard') {
  <div class="min-h-dvh p-4 sm:p-6 lg:p-8 space-y-6 bg-bg-secondary">

    <div class="flex items-center justify-between gap-4">
      <div class="space-y-2">
        <div class="h-6 w-40 bg-bg-primary border border-border rounded shimmer"></div>
        <div class="h-3 w-64 bg-bg-primary border border-border rounded shimmer"></div>
      </div>
      <div class="flex gap-2">
        <div class="w-10 h-10 bg-bg-primary border border-border rounded-2xl shimmer"></div>
        <div class="w-10 h-10 bg-bg-primary border border-border rounded-2xl shimmer"></div>
      </div>
    </div>

    <div class="space-y-4">
      <div class="h-5 w-40 bg-bg-primary border border-border rounded shimmer"></div>
      <div class="grid grid-cols-2 xl:grid-cols-4 gap-3 sm:gap-4">
        @for (i of [1, 2, 3, 4]; track i) {
          <div class="h-24 rounded-3xl bg-bg-primary border border-border shimmer"></div>
        }
      </div>
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
      <div class="xl:col-span-2 space-y-6">
        <div class="p-5 sm:p-6 rounded-3xl bg-bg-primary border border-border space-y-4">
          <div class="h-5 w-40 bg-bg-secondary rounded shimmer"></div>
          <div class="h-3 w-60 bg-bg-secondary rounded shimmer"></div>
          <div class="h-48 sm:h-64 bg-bg-secondary rounded-2xl shimmer"></div>
        </div>
        <div class="p-5 sm:p-6 rounded-3xl bg-bg-primary border border-border space-y-4">
          <div class="h-5 w-40 bg-bg-secondary rounded shimmer"></div>
          @for (i of [1, 2, 3]; track i) {
            <div class="h-20 rounded-2xl bg-bg-secondary shimmer"></div>
          }
        </div>
      </div>
      <div class="space-y-6">
        <div class="p-5 sm:p-6 rounded-3xl bg-bg-primary border border-border space-y-4">
          <div class="h-5 w-32 bg-bg-secondary rounded shimmer"></div>
          @for (i of [1, 2, 3]; track i) {
            <div class="h-12 bg-bg-secondary rounded-xl shimmer"></div>
          }
        </div>
        <div class="p-5 sm:p-6 rounded-3xl bg-bg-primary border border-border space-y-4">
          <div class="h-5 w-24 bg-bg-secondary rounded shimmer"></div>
          @for (i of [1, 2]; track i) {
            <div class="h-16 bg-bg-secondary rounded-2xl shimmer"></div>
          }
        </div>
      </div>
    </div>
  </div>
}

@if (type === 'auth') {
  <div class="w-full max-w-[420px] space-y-4 p-7">
    <div class="h-8 w-48 bg-bg-secondary border border-border rounded shimmer"></div>
    <div class="h-4 w-64 bg-bg-secondary border border-border rounded shimmer"></div>
    <div class="h-12 w-full bg-bg-secondary border border-border rounded-xl shimmer"></div>
    <div class="h-12 w-full bg-bg-secondary border border-border rounded-xl shimmer"></div>
    <div class="h-12 w-full bg-brand-200/50 rounded-xl shimmer"></div>
  </div>
}

@if (type === 'table') {
  <div class="p-6 space-y-3">
    <div class="h-4 w-full bg-bg-secondary rounded shimmer"></div>
    <div class="h-4 w-full bg-bg-secondary rounded shimmer"></div>
    <div class="h-4 w-5/6 bg-bg-secondary rounded shimmer"></div>
  </div>
}

@if (type === 'card') {
  <div class="h-24 w-full bg-bg-secondary border border-border rounded-xl shimmer"></div>
}

@if (type === 'text') {
  <div class="space-y-2">
    <div class="h-4 w-full bg-bg-secondary rounded shimmer"></div>
    <div class="h-4 w-5/6 bg-bg-secondary rounded shimmer"></div>
  </div>
}
